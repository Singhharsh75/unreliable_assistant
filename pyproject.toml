[project]
name = "unreliable-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10.0",
    "faiss-cpu",
    "graphviz",
    "huggingface-hub",
    "mcp",
    "nltk",
    "numpy",
    "onnxruntime",
    "openai>=3.3.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pillow",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "pyyaml",
    "ragas>=0.4.4",
    "rank-bm25",
    "streamlit",
    "tokenizers",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["context", "contracts", "eval", "harness", "mcp_servers", "triage"]
