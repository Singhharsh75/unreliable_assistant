[project]
name = "unreliable-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu",
    "graphviz",
    "huggingface-hub",
    "mcp",
    "nltk",
    "numpy",
    "onnxruntime",
    "pillow",
    "pydantic>=2",
    "pyyaml",
    "rank-bm25",
    "streamlit",
    "tokenizers",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "mcp_servers"]
