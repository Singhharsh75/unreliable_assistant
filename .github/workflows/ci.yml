# CI: tests, signed-manifest check, and the 36-KPI release gate (eval/kpis.py exits 1 on any FAIL; design.md §1.5).
# No LLM key is used: KPIs that need one report NOT_MEASURED. Release builds add --release, which also fails on
# unmeasured safety KPIs.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}  # optional: higher Hugging Face download limits
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('mcp_servers/rag_server.py', 'triage/nli.py', 'guardrails/classifier.py') }}
      - run: uv sync --locked
      - name: Verify signed MCP manifests
        run: uv run harness/manifest.py verify
      - name: Build indexes (RAG + graph)
        run: |
          uv run mcp_servers/rag_server.py build
          uv run mcp_servers/graphify.py build
      - name: Tests
        run: uv run pytest -q
      - name: KPI release gate
        run: uv run eval/kpis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpi-report
          path: eval/runs/kpi_report.json
